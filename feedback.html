<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Same policy as the app page, tightened: this page reads local storage and
       mades a CSV on the device, so it needs no network at all. `connect-src
       'none'` says so out loud. The stylesheet is inline, hence 'unsafe-inline'
       for styles only; scripts are files, never inline. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Local field-test answers for My Land, My Plan. Not linked from the app." />
  <title>Field-test answers | My Land, My Plan</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .feedback-page {
      max-width: 44rem;
      margin: 2rem auto;
      padding: 0 1rem 3rem;
    }
    .feedback-page h1 {
      font-size: 1.6rem;
    }
    .feedback-count {
      font-size: 1.1rem;
      margin: 0.5rem 0 1rem;
    }
    .feedback-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin: 1rem 0;
    }
    .feedback-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .feedback-table th,
    .feedback-table td {
      border: 1px solid #c9c3b2;
      padding: 0.4rem;
      text-align: left;
      vertical-align: top;
    }
    .feedback-table th {
      background: #eee9dc;
    }
  </style>
</head>
<body>
  <main class="feedback-page">
    <h1>Field-test answers</h1>
    <p>
      This page is not linked from the app. It reads only the answers saved in this browser by the
      three questions on the visit card. Nothing is uploaded, and this page has no account or server.
    </p>
    <p class="feedback-count" id="feedback-count" role="status">Reading local answers...</p>
    <div class="feedback-actions">
      <button type="button" class="btn btn-primary" id="btn-export">Export as CSV</button>
      <button type="button" class="btn btn-secondary" id="btn-clear">Delete local answers</button>
      <a class="btn btn-secondary" href="index.html">Back to the app</a>
    </div>
    <p class="hint" id="feedback-status" role="status"></p>
    <div id="feedback-table-host"></div>
    <noscript>
      <p>This page needs JavaScript to read the answers saved in this browser.</p>
    </noscript>
  </main>

  <script src="js/feedback.js" defer></script>
  <script src="js/feedback-page.js" defer></script>
</body>
</html>
